[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promete-strategy-bundle"
version = "0.1.0"
description = "Portable strategy bundles and authenticated ProfinAI import CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5,<3", "httpx>=0.26,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "build>=1,<2"]

[project.scripts]
strategy-bundle = "promete_strategy_bundle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
